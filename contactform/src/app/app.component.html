<div class="container">
  <div class="form-card">
    <h2>Get In Touch</h2>
    <p>We would love to hear from you</p>

    <form [formGroup]="form" (ngSubmit)="send()">

      <label>Full Name</label>
      <input type="text" formControlName="name" placeholder="Your name">
      <small *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
        Enter a valid name
      </small>

      <label>Email Address</label>
      <input type="text" formControlName="email" placeholder="Your email">
      <small *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        Enter a valid email
      </small>

      <label>Phone Number</label>
      <input type="text" formControlName="phone" placeholder="10 digit phone number">
      <small *ngIf="form.get('phone')?.touched && form.get('phone')?.invalid">
        Enter a valid 10 digit phone number
      </small>

      <label>Your Message</label>
      <textarea formControlName="message"
                placeholder="Write your message"></textarea>
      <small *ngIf="form.get('message')?.touched && form.get('message')?.invalid">
        Message must contain at least 10 characters
      </small>

      <button type="submit" [disabled]="form.invalid">
        Send Message
      </button>

    </form>
  </div>
</div>
